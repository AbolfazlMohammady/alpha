name: Django CI

on:
  push:
    branches:
      - main
      - feature/marketplace-logistics-accounting-release
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: babaei
          POSTGRES_USER: babaei
          POSTGRES_PASSWORD: supersecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U babaei -d babaei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: babaei
      POSTGRES_USER: babaei
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential
          rm -rf /var/lib/apt/lists/*

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r config/requirements.txt
          python -m pip install pytest pytest-django

      - name: Django system checks
        run: python config/manage.py check

      - name: Check migration consistency
        run: python config/manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest -q
