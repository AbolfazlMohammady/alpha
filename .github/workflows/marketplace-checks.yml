name: Marketplace Django checks

on:
  push:
    branches:
      - feature/marketplace-logistics-accounting-release
  pull_request:
    branches:
      - main

jobs:
  django-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-not-for-production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Install test dependencies
        run: |
          grep -vE '^(rembg\[cpu\]|onnxruntime==)' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/requirements-ci.txt

      - name: Django system check
        run: python manage.py check

      - name: Marketplace tests
        run: python manage.py test marketplace --verbosity 2

      - name: Check migration state
        run: python manage.py makemigrations --check --dry-run --verbosity 3
