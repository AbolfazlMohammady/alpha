name: Marketplace accounting checks

on:
  push:
    branches:
      - main
      - feature/marketplace-logistics-accounting-release
    paths:
      - "config/apps/marketplace/**"
      - "config/apps/orders/**"
      - "config/apps/shop/**"
      - "config/apps/customizer/**"
      - "config/config/settings.py"
      - "config/requirements.txt"
      - "docs/marketplace-logistics-accounting.md"
      - ".github/workflows/marketplace-accounting.yml"
  pull_request:
    paths:
      - "config/apps/marketplace/**"
      - "config/apps/orders/**"
      - "config/apps/shop/**"
      - "config/apps/customizer/**"
      - "config/config/settings.py"
      - "config/requirements.txt"
      - "docs/marketplace-logistics-accounting.md"
      - ".github/workflows/marketplace-accounting.yml"

permissions:
  contents: read

jobs:
  django-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Install dependencies
        working-directory: config
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Django configuration
        working-directory: config
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python manage.py check

      - name: Check migration state
        working-directory: config
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python manage.py makemigrations --check --dry-run

      - name: Run marketplace accounting and logistics tests
        working-directory: config
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python manage.py test apps.marketplace --verbosity 2
