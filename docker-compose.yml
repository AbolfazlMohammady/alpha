services:

  postgres:
    image: postgres:15-alpine
    container_name: paya_postgres
    restart: always
    env_file:
      - ./config/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: paya_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    networks:
      - default

  redis:
    image: redis:7.2-alpine
    container_name: paya_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - default

  django:
    container_name: django
    build:
      context: ./config
      dockerfile: Dockerfile
    volumes:
      - ./config:/app
      - .:/workspace:ro
      - backup_data:/var/backups/babaei
    ports:
      - "8000:8000"
    env_file:
      - ./config/.env
    environment:
      BACKUP_PROJECT_ROOT: /workspace
      BACKUP_ROOT: /var/backups/babaei
    depends_on:
      - redis
      - postgres
    networks:
      - default
    entrypoint: ["/bin/sh", "-c", "sed 's/\r$//' /app/entrypoint.sh > /tmp/entrypoint.sh && exec /bin/sh /tmp/entrypoint.sh \"$@\" ", "--"]
    command: ["gunicorn", "config.wsgi:application", "-b", "0.0.0.0:8000", "--workers", "2", "--threads", "2", "--worker-tmp-dir", "/dev/shm"]

  celery:
    container_name: celery
    build:
      context: ./config
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: config.settings
      BACKUP_PROJECT_ROOT: /workspace
      BACKUP_ROOT: /var/backups/babaei
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    entrypoint: ["/bin/sh", "-c", "export PYTHONPATH=/app DJANGO_SETTINGS_MODULE=config.settings && python -m celery -A config.celery_config worker -l INFO -Q heavy -c 1"]
    volumes:
      - ./config:/app
      - .:/workspace:ro
      - backup_data:/var/backups/babaei
    env_file:
      - ./config/.env
    depends_on:
      - redis
      - django
      - postgres
    networks:
      - default

  celery_default:
    container_name: celery_default
    build:
      context: ./config
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: config.settings
      BACKUP_PROJECT_ROOT: /workspace
      BACKUP_ROOT: /var/backups/babaei
    entrypoint: ["/bin/sh", "-c", "export PYTHONPATH=/app DJANGO_SETTINGS_MODULE=config.settings && python -m celery -A config.celery_config worker -l WARNING -Q tasks -c 2"]
    volumes:
      - ./config:/app
      - .:/workspace:ro
      - backup_data:/var/backups/babaei
    env_file:
      - ./config/.env
    depends_on:
      - redis
      - django
      - postgres
    networks:
      - default

  celery-beat:
    container_name: celery_beat
    restart: always
    build:
      context: ./config
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app
      DJANGO_SETTINGS_MODULE: config.settings
      BACKUP_PROJECT_ROOT: /workspace
      BACKUP_ROOT: /var/backups/babaei
    entrypoint: ["/bin/sh", "-c", "export PYTHONPATH=/app DJANGO_SETTINGS_MODULE=config.settings && python -m celery -A config.celery_config beat -l INFO"]
    volumes:
      - ./config:/app
      - .:/workspace:ro
      - backup_data:/var/backups/babaei
    env_file:
      - ./config/.env
    depends_on:
      - redis
      - django
      - postgres
    networks:
      - default

volumes:
  postgres_data:
  backup_data: