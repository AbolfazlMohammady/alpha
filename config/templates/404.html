{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page Not Found | BABAEI</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preload" href="{% static 'fonts/vazirmatn-var.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'css/fonts.css' %}?v=3">
    <link rel="stylesheet" href="{% static 'css/pages/404.css' %}?v=1">
</head>
<body class="not-found-page">
    <main class="not-found" aria-labelledby="not-found-title">
        <canvas class="not-found__canvas" data-not-found-canvas aria-hidden="true"></canvas>
        <div class="not-found__characters" data-not-found-characters aria-hidden="true"></div>

        <section class="not-found__message" data-not-found-message>
            <div class="not-found__message-inner">
                <p class="not-found__eyebrow">BABAEI</p>
                <h1 id="not-found-title" class="not-found__title">Page Not Found</h1>
                <div class="not-found__code">404</div>
                <p class="not-found__description">
                    The page you are looking for might have been removed,
                    had its name changed, or is temporarily unavailable.
                </p>

                <div class="not-found__actions">
                    <button type="button" class="not-found__button not-found__button--outline" data-go-back>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m12 19-7-7 7-7"></path>
                            <path d="M19 12H5"></path>
                        </svg>
                        Go Back
                    </button>

                    <a href="/" class="not-found__button not-found__button--solid">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        Go Home
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="{% static 'js/pages/404.js' %}?v=1" defer></script>
</body>
</html>
